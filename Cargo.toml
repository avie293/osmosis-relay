[package]
name = "osmosis-server"
version = "1.0.0"
edition = "2024"
description = "Coordination server for the Osmosis Minecraft mod."
license-file = "LICENSE"
publish = false

[dependencies]
env_logger = "0.11.11"
getrandom = "0.4.3"
log = "0.4.35"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "net", "io-util", "macros", "sync", "time", "signal"] }
ureq = { version = "3.5.2", default-features = false, features = ["native-tls"] }

[profile.release]
lto = "thin"
strip = true
